[project]
name = "cartpilot-mcp"
version = "0.1.0"
description = "An MCP server that lets Claude search, compare and buy products with PayPal, behind spending guardrails and human approval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
cartpilot = "cartpilot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
